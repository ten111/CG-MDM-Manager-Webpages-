<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" role="img" aria-label="CG MDM Manager Logo">
  <defs>
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="warmBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="foodStew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFA726" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Text Path for Circular text -->
    <path id="textArc" d="M 45,150 A 105,105 0 0,0 255,150" />
  </defs>

  <!-- Outer Base Ring -->
  <circle cx="150" cy="150" r="142" fill="#FFFFFF" stroke="#0D47A1" stroke-width="6"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#E3F2FD" stroke-width="2"/>

  <!-- Blue Arc Banner at Bottom -->
  <path d="M 32,150 A 118,118 0 0,0 268,150 L 254,150 A 104,104 0 0,1 46,150 Z" fill="url(#blueRing)"/>

  <!-- Text "CG MDM MANAGER" on arc -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      CG MDM MANAGER
    </textPath>
  </text>

  <!-- Inner Circle Area -->
  <circle cx="150" cy="120" r="88" fill="#F8FAFC"/>

  <!-- Group of School Children (Stylized silhouettes / illustrations) -->
  <g id="children">
    <!-- Child 1 (Far Left Boy) -->
    <g transform="translate(85, 76) scale(0.65)">
      <circle cx="20" cy="12" r="12" fill="#8D5B4C"/> <!-- Hair -->
      <circle cx="20" cy="18" r="10" fill="#F5CBA7"/> <!-- Face -->
      <path d="M 12,14 Q 20,6 28,14 Z" fill="#42210B"/> <!-- Hair Front -->
      <path d="M 6,36 C 6,26 14,24 20,24 C 26,24 34,26 34,36 Z" fill="#1E88E5"/> <!-- Shirt -->
      <polygon points="17,24 20,30 23,24" fill="#FFFFFF"/> <!-- Collar -->
    </g>

    <!-- Child 2 (Left-Mid Girl with Ribbons) -->
    <g transform="translate(110, 68) scale(0.7)">
      <circle cx="20" cy="12" r="14" fill="#2C1810"/> <!-- Pigtails base -->
      <circle cx="6" cy="14" r="5" fill="#E53935"/> <!-- Ribbon Left -->
      <circle cx="34" cy="14" r="5" fill="#E53935"/> <!-- Ribbon Right -->
      <circle cx="20" cy="18" r="10" fill="#F3C299"/> <!-- Face -->
      <path d="M 10,14 Q 20,8 30,14 Z" fill="#2C1810"/>
      <path d="M 4,38 C 4,26 12,24 20,24 C 28,24 36,26 36,38 Z" fill="#FB8C00"/> <!-- Dress -->
      <circle cx="17" cy="17" r="1.5" fill="#2C1810"/>
      <circle cx="23" cy="17" r="1.5" fill="#2C1810"/>
      <path d="M 18,22 Q 20,25 22,22" stroke="#B71C1C" stroke-width="1" fill="none"/>
    </g>

    <!-- Child 3 (Center Smiling Student) -->
    <g transform="translate(136, 62) scale(0.76)">
      <circle cx="18" cy="12" r="13" fill="#2D1A10"/> <!-- Hair -->
      <circle cx="18" cy="18" r="10.5" fill="#F8C498"/> <!-- Face -->
      <path d="M 8,14 Q 18,7 28,14 Z" fill="#20120B"/>
      <path d="M 2,40 C 2,27 10,25 18,25 C 26,25 34,27 34,40 Z" fill="#43A047"/> <!-- School uniform -->
      <polygon points="15,25 18,32 21,25" fill="#FFFFFF"/>
      <circle cx="15" cy="17" r="1.5" fill="#2C1810"/>
      <circle cx="21" cy="17" r="1.5" fill="#2C1810"/>
      <path d="M 16,21 Q 18,24 20,21" stroke="#8D5B4C" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Child 4 (Right-Mid Girl) -->
    <g transform="translate(164, 68) scale(0.7)">
      <circle cx="20" cy="12" r="14" fill="#26170E"/>
      <circle cx="5" cy="15" r="4.5" fill="#1E88E5"/>
      <circle cx="35" cy="15" r="4.5" fill="#1E88E5"/>
      <circle cx="20" cy="18" r="10" fill="#ECC097"/>
      <path d="M 10,14 Q 20,8 30,14 Z" fill="#26170E"/>
      <path d="M 4,38 C 4,26 12,24 20,24 C 28,24 36,26 36,38 Z" fill="#8E24AA"/>
      <circle cx="17" cy="17" r="1.5" fill="#2C1810"/>
      <circle cx="23" cy="17" r="1.5" fill="#2C1810"/>
      <path d="M 18,22 Q 20,24.5 22,22" stroke="#B71C1C" stroke-width="1" fill="none"/>
    </g>

    <!-- Child 5 (Far Right Boy) -->
    <g transform="translate(190, 76) scale(0.65)">
      <circle cx="20" cy="12" r="12" fill="#3E2723"/>
      <circle cx="20" cy="18" r="10" fill="#E6B88A"/>
      <path d="M 11,13 Q 20,6 29,13 Z" fill="#21130D"/>
      <path d="M 6,36 C 6,26 14,24 20,24 C 26,24 34,26 34,36 Z" fill="#E53935"/>
      <polygon points="17,24 20,30 23,24" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Mid-Day Meal Steaming Bowl / Degchi / Thali -->
  <g id="mealBowl" transform="translate(0, 10)">
    <!-- Steam Swirls -->
    <path d="M 136,112 C 132,102 140,96 136,88" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 150,110 C 146,98 156,92 150,82" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 164,112 C 160,102 168,96 164,88" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Bowl Rim Back -->
    <ellipse cx="150" cy="132" rx="46" ry="11" fill="#D7CCC8"/>
    
    <!-- Food Stew Inside Bowl -->
    <ellipse cx="150" cy="132" rx="42" ry="9" fill="url(#foodStew)"/>
    <!-- Veggie and Rice Flecks in Meal -->
    <circle cx="140" cy="132" r="2.5" fill="#43A047"/>
    <circle cx="158" cy="131" r="2.2" fill="#E53935"/>
    <circle cx="148" cy="133" r="2" fill="#FFFFFF"/>
    <circle cx="166" cy="133" r="1.8" fill="#43A047"/>
    <circle cx="134" cy="131" r="2" fill="#FFF9C4"/>
    <circle cx="153" cy="134" r="2" fill="#EF6C00"/>

    <!-- Bowl Front Body -->
    <path d="M 104,132 C 104,162 130,172 150,172 C 170,172 196,162 196,132 Z" fill="url(#warmBowl)" stroke="#BF360C" stroke-width="2"/>
    <!-- Bowl Base Stand -->
    <ellipse cx="150" cy="172" rx="24" ry="4" fill="#D84315"/>

    <!-- Bowl Rim Front Highlight -->
    <path d="M 104,132 C 114,142 186,142 196,132" stroke="#FFE082" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- Green Healthy Leaves Flanking the Bowl -->
  <g id="greenLeaves">
    <!-- Left Leaf -->
    <path d="M 102,154 C 86,146 82,130 96,126 C 98,140 106,148 102,154 Z" fill="#2E7D32"/>
    <path d="M 98,142 C 86,138 90,148 98,142 Z" fill="#66BB6A"/>
    <!-- Right Leaf -->
    <path d="M 198,154 C 214,146 218,130 204,126 C 202,140 194,148 198,154 Z" fill="#2E7D32"/>
    <path d="M 202,142 C 214,138 210,148 202,142 Z" fill="#66BB6A"/>
  </g>

  <!-- Small Stars / Sparkles of Nutrition -->
  <circle cx="86" cy="116" r="2" fill="#F59E0B"/>
  <circle cx="214" cy="116" r="2" fill="#F59E0B"/>
  <circle cx="150" cy="54" r="2.5" fill="#F59E0B"/>
</svg>
